name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: https://mcp.example.com
      CHATGPT_CALLBACK_URL: https://chatgpt.com/connector/oauth/test-callback
      OAUTH_CLIENT_SECRET: test-only-secret
      MCP_USER_PASSWORD: test-only-password
      KEYCLOAK_ADMIN_PASSWORD: test-only-password
      POSTGRES_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate tunnel profiles
        run: docker compose --profile tunnel --profile quick-tunnel config --quiet
      - name: Validate helper scripts
        run: |
          bash -n scripts/init-env.sh
          bash -n scripts/quick-tunnel.sh
          bash -n scripts/runner-entrypoint.sh
      - name: Validate environment initialization
        run: |
          test_env="$(mktemp -u)"
          ENV_FILE="$test_env" bash scripts/init-env.sh
          ! grep -Eq '=(auto|AUTO|generate|GENERATE)$' "$test_env"
          grep -q '^CHATGPT_CALLBACK_URL=https://chatgpt.com/connector/oauth/\*$' "$test_env"
          test "$(stat -c '%a' "$test_env")" = 600
          rm -f "$test_env"
      - name: Build sandbox image
        run: docker build -t docker-mcp-chatgpt:test .
      - name: Validate root password entrypoint
        run: docker run --rm --user 0 -e ROOT_PASSWORD=root --entrypoint /usr/local/bin/runner-entrypoint.sh docker-mcp-chatgpt:test true
      - name: Compile Python source
        run: docker run --rm --entrypoint python docker-mcp-chatgpt:test -m compileall -q /app/src
